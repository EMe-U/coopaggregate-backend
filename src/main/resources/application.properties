spring.application.name=coopaggregate-backend

server.port=${PORT:8080}
# Behind Render's proxy the client address comes from X-Forwarded-For (only from trusted internal proxies).
# The public endpoints limit requests per address, so it must be the buyer's and not the proxy's.
server.forward-headers-strategy=native

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway manages the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Used only to create the manager account when the manager table is empty
app.manager.name=${MANAGER_NAME:}
app.manager.email=${MANAGER_EMAIL:}
app.manager.password=${MANAGER_PASSWORD:}

# SMS to members. SMS_PROVIDER is "log" (sends nothing, development), "africastalking" or "traccar".
app.sms.provider=${SMS_PROVIDER:log}
# Development only: the log provider prints the real one-time codes in the console. Refused with real providers.
app.sms.log-show-codes=${SMS_LOG_SHOW_CODES:false}
app.sms.at.username=${AT_USERNAME:}
app.sms.at.api-key=${AT_API_KEY:}
app.sms.at.sender-id=${AT_SENDER_ID:}
app.sms.traccar.url=${SMS_TRACCAR_URL:https://www.traccar.org/sms/}
app.sms.traccar.token=${SMS_TRACCAR_TOKEN:}
# Secret the SMS provider must send with replies. Empty means replies are refused.
app.sms.inbound-secret=${SMS_INBOUND_SECRET:}
# TEMPORARY, for the demo only: 6 digits also accepted as the code of any pending delivery. Empty means off.
app.sms.demo-code=${SMS_DEMO_CODE:}

# Member identity verification with MOSIP eSignet. With MOSIP_ENABLED=true the five required values below must be set
# or the app does not start. The authorize, token, userinfo and JWKS URLs follow from MOSIP_BASE_URL (/oauth2/...).
# The private key stays in a file outside the repository; only its path and its kid are settings.
app.identity.mosip.enabled=${MOSIP_ENABLED:false}
app.identity.mosip.base-url=${MOSIP_BASE_URL:}
app.identity.mosip.client-id=${MOSIP_CLIENT_ID:}
app.identity.mosip.redirect-uri=${MOSIP_REDIRECT_URI:}
app.identity.mosip.private-key-path=${MOSIP_PRIVATE_KEY_PATH:}
app.identity.mosip.key-id=${MOSIP_KEY_ID:}
app.identity.mosip.scope=${MOSIP_SCOPE:openid}
app.identity.mosip.acr-values=${MOSIP_ACR_VALUES:mosip:idp:acr:password}
app.identity.mosip.assertion-audience=${MOSIP_ASSERTION_AUDIENCE:}
# The exact iss of the id_token and the userinfo answer; empty means MOSIP_BASE_URL.
app.identity.mosip.expected-issuer=${MOSIP_ISSUER:}
# The exact iss of the userinfo answer only; empty means the same as the id_token's.
app.identity.mosip.expected-userinfo-issuer=${MOSIP_USERINFO_ISSUER:}
# The id_token acr values (login methods) that count as verified, space-separated; empty means the one-time code only.
app.identity.mosip.allowed-acrs=${MOSIP_ALLOWED_ACRS:}

# An SMS provider that does not answer must not hold a thread for long.
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=15s
