spring.application.name=coopaggregate-backend

server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway manages the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Used only to create the manager account when the manager table is empty
app.manager.name=${MANAGER_NAME:}
app.manager.email=${MANAGER_EMAIL:}
app.manager.password=${MANAGER_PASSWORD:}
